<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小铺 · 演示站 broken（故意改坏）</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f6f7f9; color: #1b1f24; }
  .box { max-width: 560px; margin: 0 auto; background: #fff; padding: 24px; border: 1px solid #e5e7eb; }
  .title { font-size: 20px; margin: 0 0 16px; }
  .row { margin: 10px 0; }
  .row label { display: block; margin-bottom: 4px; }
  .row input { padding: 8px; width: 90%; border: 1px solid #ccc; }
  .btn { padding: 8px 14px; border: 0; background: #2f6feb; color: #fff; cursor: pointer; margin: 4px; }
  .err { color: #c62828; margin-top: 10px; }
  .item { border: 1px solid #eee; padding: 12px; margin: 10px 0; }
  .nav { display: flex; justify-content: space-between; align-items: center; }
  .hidden { display: none; }
</style>
</head>
<body>
<div id="app">

  <div class="box" id="loginPage">
    <h2 class="title">登录</h2>
    <div class="row"><label for="u">用户名</label><input id="u" type="text" autocomplete="off"></div>
    <div class="row"><label for="p">密码</label><input id="p" type="password" autocomplete="off"></div>
    <div class="row"><button class="btn" id="loginBtn" type="button">登录</button></div>
    <div class="err hidden" id="err">账号或密码不对</div>
  </div>

  <div class="box hidden" id="shopPage">
    <div class="nav">
      <h2 class="title">商品列表</h2>
      <div>
        <button class="btn" id="cartBtn" type="button">购物车 0</button>
        <button class="btn" id="menuBtn" type="button">菜单</button>
      </div>
    </div>
    <div class="item"><span>手工皂 · 原味</span><button class="btn add" type="button">加入购物车</button></div>
    <div class="item"><span>手工皂 · 柑橘</span><button class="btn add" type="button">加入购物车</button></div>
    <div class="hidden" id="logoutWrap"><button class="btn" id="logoutBtn" type="button">退出登录</button></div>
  </div>

  <div class="box hidden" id="cartPage">
    <h2 class="title">购物车</h2>
    <div id="cartInfo">共 0 件</div>
    <button class="btn" id="checkoutBtn" type="button">去结算</button>
  </div>

  <div class="box hidden" id="checkoutPage">
    <h2 class="title">填写收货信息</h2>
    <div class="row"><label for="fn">收件人</label><input id="fn" type="text"></div>
    <div class="row"><label for="tel">电话</label><input id="tel" type="text"></div>
    <div class="row"><label for="addr">地址</label><input id="addr" type="text"></div>
    <button class="btn" id="submitBtn" type="button">提交订单</button>
  </div>

  <div class="box hidden" id="donePage">
    <h2 class="title">下单成功</h2>
    <div>我们会尽快发货。</div>
  </div>

</div>
<script>
  const $ = (id) => document.getElementById(id);
  const pages = ['loginPage', 'shopPage', 'cartPage', 'checkoutPage', 'donePage'];
  const show = (id) => pages.forEach((p) => $(p).classList.toggle('hidden', p !== id));
  let cart = 0;

  $('loginBtn').onclick = () => {
    if ($('u').value === 'demo' && $('p').value === '123456') {
      $('err').classList.add('hidden');
      show('shopPage');
    } else {
      $('err').classList.remove('hidden');
    }
  };
  document.querySelectorAll('.add').forEach((b) => {
    // 故意制造的回归：模拟「AI 改这一块时顺手把角标状态更新弄丢了」。
    // 页面看起来一切正常，只有自动检查会立刻发现购物车数量不对。
    b.onclick = () => { cart += 1; /* 故障：角标更新丢失 */ };
  });
  $('cartBtn').onclick = () => { $('cartInfo').textContent = '共 ' + cart + ' 件'; show('cartPage'); };
  $('menuBtn').onclick = () => $('logoutWrap').classList.toggle('hidden');
  $('logoutBtn').onclick = () => {
    cart = 0; $('cartBtn').textContent = '购物车 0';
    $('u').value = ''; $('p').value = '';
    show('loginPage');
  };
  $('checkoutBtn').onclick = () => show('checkoutPage');
  $('submitBtn').onclick = () => show('donePage');
</script>
</body>
</html>
